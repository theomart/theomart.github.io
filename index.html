---
layout: default
---

<div style="margin-bottom: 40px;">
    <p style="font-size: 1.2em; margin-bottom: 15px;">Hi! I'm Theo Martin, an AI engineer.</p>
    <p style="margin-bottom: 15px;">I live in Paris, France.</p>
    <p>Contact me at <a href="mailto:contacttheomartin@gmail.com">contacttheomartin@gmail.com</a>.</p>
</div>

<div>
    <h2 style="margin-bottom: 20px;">Latest Posts</h2>
    <ul class="post-list">
      {% for post in site.posts limit:5 %}
        <li class="post-item">
          <span class="post-date">{{ post.date | date: "%d %b, %Y" }}</span>
          <a href="{{ post.url }}" class="post-title">{{ post.title }}</a>
        </li>
      {% endfor %}
    </ul>
    
    <p style="margin-top: 30px;">
        <a href="/blog" style="color: #4A90E2; text-decoration: none;">View all posts →</a>
    </p>
</div>
