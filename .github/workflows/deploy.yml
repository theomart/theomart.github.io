name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Les deux permissions réclamées par deploy-pages, plus la lecture du repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install markdown
        run: pip install -r requirements.txt

      # build.py sort en erreur si un article est mal formé ou s'il reste un marqueur
      # non substitué dans une page, ce qui fait échouer le job avant tout déploiement.
      - name: Build
        run: python3 build.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload _site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
