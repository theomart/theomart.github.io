---
layout: unified
---

<article class="post-content">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        
        <div class="post-meta">
            <span class="post-date">{{ page.date | date: "%d %b, %Y" }}</span>
            {% if page.source %}
                <span class="post-source">{{ page.source }}</span>
            {% endif %}
        </div>
    </header>
    
    <div class="post-body">
        {{ content }}
    </div>
</article>
