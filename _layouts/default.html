<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} - {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: white;
        }
        
        .header {
            margin-bottom: 60px;
        }
        
        .site-title {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            margin-bottom: 20px;
            display: block;
        }
        
        .nav {
            font-size: 1.1em;
        }
        
        .nav a {
            color: #4A90E2;
            text-decoration: none;
            margin-right: 20px;
        }
        
        .nav a:hover {
            text-decoration: underline;
        }
        
        .post-list {
            list-style: none;
            padding: 0;
        }
        
        .post-item {
            margin-bottom: 30px;
            display: flex;
            align-items: baseline;
            gap: 20px;
        }
        
        .post-date {
            color: #666;
            font-size: 0.9em;
            min-width: 120px;
            font-family: monospace;
        }
        
        .post-title {
            color: #4A90E2;
            text-decoration: none;
            font-size: 1.1em;
        }
        
        .post-title:hover {
            text-decoration: underline;
        }
        
        .post-content h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #333;
        }
        
        .post-content h2 {
            font-size: 1.5em;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .post-content p {
            margin-bottom: 20px;
        }
        
        .post-content a {
            color: #4A90E2;
            text-decoration: none;
        }
        
        .post-content a:hover {
            text-decoration: underline;
        }
        
        .post-content code {
            background: #f5f5f5;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        
        .post-content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 20px 0;
        }
        
        .post-content blockquote {
            border-left: 4px solid #4A90E2;
            padding-left: 20px;
            margin: 20px 0;
            color: #666;
        }
        
        .post-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 30px;
        }
        
        @media (max-width: 600px) {
            .post-item {
                flex-direction: column;
                gap: 5px;
            }
            
            .post-date {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="site-title">{{ site.title | default: "theomart" }}</a>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/blog">Blog</a>
            <a href="/aiservices">AI Services</a>
        </nav>
    </header>
    
    <main>
        {{ content }}
    </main>
</body>
</html>
