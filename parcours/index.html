   - An era rail (years in the margin, with a tiny avatar in the current era's outfit) navigates between eras with a pixel teleport.
   - prefers-reduced-motion: no scrubbing, every scene is a still frame, the text is shown in full.

  S.defineScene({

    text: { en: 'As tech lead I also build apps myself. The first one writes product descriptions and attributes directly inside the PIM. It looks at the photo and at the attributes already filled in, and drafts the rest, for hundreds of retailers, which meant making it run at scale.', fr: 'En tant que tech lead je développe aussi des applications moi-même. La première rédige descriptions et attributs de produits directement dans le PIM. Il regarde la photo et les attributs déjà remplis, puis propose le reste, pour des centaines d’enseignes, ce qui demandait de le faire tourner à grande échelle.' },
    details: [
      { x: .56, y: .3, icon: '◫', at: .7, title: { en: 'Image plus attributes', fr: 'Image plus attributs' }, body: { en: 'The model receives the picture and the attributes that are already known, and must return the missing ones in a fixed shape, so the PIM can check and store them.\n    messages = [image(url), text(known_attributes)]\n    out = model.generate(messages, schema=ProductSchema)', fr: 'Le modèle reçoit l’image et les attributs déjà connus, et doit rendre les manquants dans une forme fixe, pour que le PIM puisse les vérifier et les ranger.\n    messages = [image(url), text(known_attributes)]\n    out = model.generate(messages, schema=ProductSchema)' } },

  S.defineScene({
    id: 'ak-proxy', duration: 10, side: 'left',

    text: { en: 'I wrote the library that handles our calls to LLMs, used by other teams and not only mine. It sends every call through a single proxy, LiteLLM, which I had recommended in January 2024. Each customer’s cost is traced, a failing provider is replaced by another, and the logs per request were cut by half to three quarters. Since all calls go through one place, security can control them, and security was delighted.', fr: 'J’ai écrit la bibliothèque qui gère nos appels aux LLM, utilisée par d’autres équipes et pas seulement la mienne. Elle envoie chaque appel par un seul proxy, LiteLLM, que j’avais recommandé en janvier 2024. Le coût de chaque client est tracé, un fournisseur en panne est remplacé par un autre, et les logs par requête ont été réduits de moitié à trois quarts. Comme tous les appels passent au même endroit, la sécurité peut les contrôler, et elle était ravie.' },
    details: [
      { x: .57, y: .27, icon: '⇄', at: .6, title: { en: 'Why a proxy', fr: 'Pourquoi un proxy' }, body: { en: 'The code speaks one dialect (the OpenAI one); the proxy translates for each provider, and changing provider becomes a line of configuration, not a rewrite.\n    model_list:\n      - model_name: vision\n        litellm_params: { model: vertex_ai/gemini-pro-vision }', fr: 'Le code parle un seul dialecte (celui d’OpenAI) ; le proxy traduit pour chaque fournisseur, et changer de fournisseur devient une ligne de configuration, pas une réécriture.\n    model_list:\n      - model_name: vision\n        litellm_params: { model: vertex_ai/gemini-pro-vision }' } },
      { x: .36, y: .72, icon: '€', at: 1.5, title: { en: 'Cost per customer', fr: 'Coût par client' }, body: { en: 'The customer is sent with each request, and the cost computed by the proxy comes back in a response header, so each team can read what their customers consume.\n    X-Customer-Id: <id>   (request)\n    x-litellm-response-cost: <value>   (response)', fr: 'Le client est envoyé avec chaque requête, et le coût calculé par le proxy revient dans un en-tête de réponse, donc chaque équipe peut lire ce que consomment ses clients.\n    X-Customer-Id: <id>   (requête)\n    x-litellm-response-cost: <valeur>   (réponse)' } },
      { x: .87, y: .5, icon: '↯', at: 4.6, title: { en: 'Fallback', fr: 'Bascule' }, body: { en: 'When a provider answers with errors, the router retries on another one that offers the same model class, and the caller never notices.\n    router_settings:\n      fallbacks: [{ "gpt-main": ["claude-main"] }]\n      num_retries: 2', fr: 'Quand un fournisseur répond par des erreurs, le routeur réessaie sur un autre qui offre la même classe de modèle, et l’appelant ne s’en aperçoit pas.\n    router_settings:\n      fallbacks: [{ "gpt-main": ["claude-main"] }]\n      num_retries: 2' } },

  // ------------------------------------------------------------------ 4. the Data Architect Agent
  S.defineScene({
    id: 'ak-architect', duration: 15, side: 'right',
    kicker: { en: 'The Data Architect Agent', fr: 'L’agent Data Architect' },
    text: { en: 'Take a retailer with a huge catalogue, call it Interfour, a wink to two well-known French chains. Before, many people went through its tables by hand, one after the other, for months. With the Data Architect Agent we just drop the data in: agents read it, generate the questions, answer them, check the answers against the rules, a person approves at each gate, and onboarding goes from months to a few hours.', fr: 'Prenez une enseigne au catalogue immense, appelons-la Interfour, clin d’œil à deux grandes enseignes françaises. Avant, beaucoup de personnes parcouraient ses tables à la main, l’une après l’autre, pendant des mois. Avec l’agent Data Architect on dépose simplement les données : des agents les lisent, génèrent les questions, y répondent, vérifient les réponses contre les règles, une personne valide à chaque porte, et l’intégration passe de plusieurs mois à quelques heures.' },
    details: [
      { x: .5, y: .06, icon: '⛓', at: .8, title: { en: 'Agents in a chain', fr: 'Des agents en chaîne' }, body: { en: 'Each agent has one job and hands a typed result to the next: one reads the columns and values, one asks the questions the data raises, one proposes the mapping to the schema, one checks the proposal against the rules.\n    profile = analyst(catalog)\n    questions = asker(profile)\n    mapping = mapper(profile, answers, schema)\n    report  = checker(mapping, rules)', fr: 'Chaque agent a un seul travail et passe un résultat typé au suivant : l’un lit les colonnes et les valeurs, l’un pose les questions que soulèvent les données, l’un propose la correspondance avec le schéma, l’un vérifie la proposition contre les règles.\n    profile = analyst(catalog)\n    questions = asker(profile)\n    mapping = mapper(profile, answers, schema)\n    report  = checker(mapping, rules)' } },
      { x: .5, y: .62, icon: '✋', at: 6.4, title: { en: 'Human gates', fr: 'Validations humaines' }, body: { en: 'The agent never writes to the retailer’s catalogue by itself. At a gate the run is paused, a person sees the proposal and the checks, and approves, corrects or sends it back.\n    interrupt(proposal)   # waits for a human decision', fr: 'L’agent n’écrit jamais seul dans le catalogue de l’enseigne. À une porte, l’exécution est en pause, une personne voit la proposition et les contrôles, puis approuve, corrige ou renvoie.\n    interrupt(proposal)   # attend une décision humaine' } },
