# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Theo Martin
email: contacttheomartin@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  My (Theo) blog.
baseurl: "" # Change this line
url: "https://theomart.in" # Ensure this is correct
twitter_username: theoakatheo
github_username: theomart

domain: theomart.in

# Build settings
theme: minima
plugins:
  - jekyll-feed # This is required for the RSS feed
  - jekyll-remote-theme
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Add these lines at the end of the file
sass:
  sass_dir: _sass
  style: compressed

# Featured posts for navigation
# Change these filenames to feature different posts in the blog submenu
featured_posts:
  - "2024-08-26-colbert.markdown"
  - "2024-09-21-developers-who-dont-use-ai-assisted-coding-are-already-falli.markdown"
  - "2025-03-31-rewriting-from-scratch-is-increasingly-viable-due-to-ai-assi.markdown"

# Localization configuration
localization:
  # Pages that support both English and French
  localizable_pages:
    - "/"
    - "/aiservices"
    - "/team"
    - "/success"
    - "/talk"
  
  # Pages that are English-only
  english_only_pages:
    - "/blog"
  
  # Navigation labels
  nav_labels:
    en:
      home: "Home"
      blog: "Blog"
      ai_consulting: "AI Consulting"
      services: "Services"
      about: "About"
      team: "Team"
      case_studies: "Case Studies"
      lets_talk: "Let's Talk"
      ai_strategy: "AI Strategy & Roadmap"
      machine_learning: "Machine Learning"
      generative_ai: "Generative AI & LLM"
      process_automation: "Process Automation"
      team_productivity: "Team Productivity"
    fr:
      home: "Accueil"
      blog: "Blog"
      ai_consulting: "Conseil IA"
      services: "Services"
      about: "À propos"
      team: "Équipe"
      case_studies: "Cas d'étude"
      lets_talk: "Discutons"
      ai_strategy: "Stratégie IA & Roadmap"
      machine_learning: "Machine Learning"
      generative_ai: "IA Générative & LLM"
      process_automation: "Automatisation"
      team_productivity: "Productivité Équipe"
